<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fund Transfer Status — Admin</title>
<style>
  :root{
    --navy:#1F3864;
    --accent:#2E5395;
    --accent-light:#D9E2F3;
    --yellow:#FFF2CC;
    --gray-bg:#F5F6F8;
    --gray-border:#D9DEE6;
    --text-muted:#6B7280;
    --white:#FFFFFF;

    --st-pending-fg:#8A6D00;      --st-pending-bg:#FFF3C4;
    --st-printed-fg:#B24E00;      --st-printed-bg:#FFE3C2;
    --st-forwarded-fg:#00695C;    --st-forwarded-bg:#CFEDE8;
    --st-completed-fg:#2E7D32;    --st-completed-bg:#D9F0DA;
    --st-cancelled-fg:#B00020;    --st-cancelled-bg:#F7D6DC;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--gray-bg);
    color:#1A1A1A;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:Verdana, Geneva, sans-serif;}

  a{color:inherit;text-decoration:none;}

  /* ---------- NAVBAR ---------- */
  .navbar{
    background:var(--navy);
    color:#fff;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:60px;
    position:sticky;
    top:0;
    z-index:50;
  }
  .navbar .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:bold;font-size:17px;letter-spacing:.2px;
  }
  .navbar .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:#8FB3E8;
  }
  .navbar nav{display:flex;gap:4px;align-items:center;}
  .navbar nav a{
    padding:8px 14px;border-radius:6px;font-size:14px;font-weight:bold;
    color:#D7E2F2;
  }
  .navbar nav a.active, .navbar nav a:hover{background:rgba(255,255,255,.12); color:#fff;}
  .role-toggle{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    padding:5px 6px 5px 12px;border-radius:20px;
    font-size:12px;
  }
  .role-toggle button{
    border:none;background:#fff;color:var(--navy);
    font-weight:bold;font-size:12px;padding:5px 12px;border-radius:16px;cursor:pointer;
  }
  .role-toggle button.secondary{background:transparent;color:#D7E2F2;}
  .role-toggle .who{opacity:.85}

  /* ---------- LAYOUT ---------- */
  .page{max-width:1180px;margin:0 auto;padding:32px 24px 64px;}
  .hidden{display:none !important;}

  /* ---------- HOME / HERO ---------- */
  .hero{
    background:linear-gradient(135deg,var(--navy) 0%, var(--accent) 100%);
    color:#fff;
    padding:72px 24px 96px;
    text-align:center;
  }
  .hero h1{
    font-size:40px;margin:0 0 10px;letter-spacing:.5px;
  }
  .hero p{
    font-size:17px;color:#D7E2F2;margin:0 0 34px;
  }
  .search-card{
    max-width:680px;margin:0 auto;
    background:#fff;border-radius:12px;
    padding:22px;
    box-shadow:0 18px 40px rgba(0,0,0,.18);
    display:flex;gap:10px;
  }
  .search-card input{
    flex:1;border:1px solid var(--gray-border);border-radius:8px;
    padding:14px 16px;font-size:15px;font-family:inherit;
    color:#1A1A1A;
  }
  .search-card input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .search-card button{
    background:var(--navy);color:#fff;border:none;border-radius:8px;
    padding:0 26px;font-weight:bold;font-size:14px;letter-spacing:.5px;
    cursor:pointer;
  }
  .search-card button:hover{background:var(--accent);}
  .search-hint{
    max-width:680px;margin:14px auto 0;color:#CBDAF0;font-size:12.5px;text-align:left;padding:0 4px;
  }

  .home-below{max-width:1000px;margin:-46px auto 0;padding:0 24px 60px;}
  .quicklinks{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  }
  .quicklink-card{
    background:#fff;border:1px solid var(--gray-border);border-radius:10px;
    padding:18px 20px;box-shadow:0 4px 16px rgba(16,30,54,.06);
  }
  .quicklink-card .k{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:bold;}
  .quicklink-card .v{font-size:15px;color:var(--navy);font-weight:bold;margin-top:6px;}

  /* ---------- SECTION HEADERS (Excel-style) ---------- */
  .section-title{
    background:var(--accent);color:#fff;font-weight:bold;font-size:13px;
    padding:10px 16px;border-radius:6px 6px 0 0;letter-spacing:.3px;
  }
  .section-body{
    background:#fff;border:1px solid var(--gray-border);border-top:none;
    border-radius:0 0 8px 8px;padding:20px;
    box-shadow:0 2px 10px rgba(16,30,54,.04);
  }
  .card-block{margin-bottom:26px;}

  h2.page-h{color:var(--navy);font-size:24px;margin:0 0 4px;}
  p.page-sub{color:var(--text-muted);font-size:14px;margin:0 0 24px;}

  /* ---------- STATUS PILL ---------- */
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:bold;padding:5px 12px;border-radius:20px;
    white-space:nowrap;
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .st-PENDING{color:var(--st-pending-fg);background:var(--st-pending-bg);}
  .st-PENDING .dot{background:var(--st-pending-fg);}
  .st-PRINTED{color:var(--st-printed-fg);background:var(--st-printed-bg);}
  .st-PRINTED .dot{background:var(--st-printed-fg);}
  .st-FORWARDED_TO_GEN_ACCTG{color:var(--st-forwarded-fg);background:var(--st-forwarded-bg);}
  .st-FORWARDED_TO_GEN_ACCTG .dot{background:var(--st-forwarded-fg);}
  .st-COMPLETED{color:var(--st-completed-fg);background:var(--st-completed-bg);}
  .st-COMPLETED .dot{background:var(--st-completed-fg);}
  .st-CANCELLED{color:var(--st-cancelled-fg);background:var(--st-cancelled-bg);}
  .st-CANCELLED .dot{background:var(--st-cancelled-fg);}

  /* ---------- TABLES ---------- */
  table.grid{width:100%;border-collapse:collapse;font-size:13.5px;position:relative;}
  table.grid thead th{
    background:var(--navy);color:#fff;text-align:left;padding:10px 12px;
    font-size:12px;letter-spacing:.3px;position:sticky;top:0;z-index:2;
    cursor:pointer;user-select:none;
  }
  table.grid thead th:hover{background:var(--accent);}
  table.grid tbody td{
    padding:10px 12px;border-bottom:1px solid #EEF1F5;font-family:Verdana, sans-serif;font-size:12.5px;
  }
  table.grid tbody tr:hover{background:#F3F6FB;cursor:pointer;}
  table.grid tbody tr:nth-child(even){background:#FAFBFD;}
  table.grid tbody tr:nth-child(even):hover{background:#F3F6FB;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .results-meta{font-size:13px;color:var(--text-muted);margin-bottom:10px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--text-muted);
  }
  .empty-state .big{font-size:36px;margin-bottom:8px;}

  /* ---------- DETAIL PAGE ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:bold;font-size:13px;margin-bottom:18px;cursor:pointer;}
  .detail-top{
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;
    margin-bottom:22px;
  }
  .ft-id{font-size:13px;color:var(--text-muted);font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
  .ft-title{font-size:28px;color:var(--navy);font-weight:bold;margin:4px 0 0;}
  .summary-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px;
  }
  .summary-item{
    background:#fff;border:1px solid var(--gray-border);border-radius:8px;padding:14px 16px;
  }
  .summary-item .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:bold;letter-spacing:.4px;}
  .summary-item .v{font-size:17px;color:#1A1A1A;font-weight:bold;margin-top:4px;font-family:Verdana,sans-serif;}

  .status-banner{
    border-radius:10px;padding:20px 22px;margin-bottom:30px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  }
  .status-banner .left{display:flex;align-items:center;gap:14px;}
  .status-banner .circle{width:14px;height:14px;border-radius:50%;flex:none;}
  .status-banner .label{font-size:20px;font-weight:bold;}
  .status-banner .updated{font-size:13px;opacity:.85;}

  /* ---------- TIMELINE ---------- */
  .timeline{display:flex;justify-content:space-between;position:relative;margin:10px 0 6px;}
  .timeline::before{
    content:"";position:absolute;top:19px;left:6%;right:6%;height:3px;background:#E3E7EE;z-index:0;
  }
  .timeline .step{flex:1;text-align:center;position:relative;z-index:1;padding:0 6px;}
  .timeline .step .node{
    width:38px;height:38px;border-radius:50%;background:#E3E7EE;color:#9AA3B2;
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:bold;
    border:3px solid var(--gray-bg);font-size:16px;
  }
  .timeline .step.done .node{background:var(--st-completed-fg);color:#fff;}
  .timeline .step.current .node{background:var(--accent);color:#fff;}
  .timeline .step.cancelled .node{background:var(--st-cancelled-fg);color:#fff;}
  .timeline .step .title{font-size:12.5px;font-weight:bold;color:var(--navy);}
  .timeline .step .date{font-size:11.5px;color:var(--text-muted);margin-top:3px;font-family:Verdana,sans-serif;}
  .timeline .step:not(.done):not(.current):not(.cancelled) .title{color:#9AA3B2;}

  @media (max-width:720px){
    .timeline{flex-direction:column;gap:18px;}
    .timeline::before{display:none;}
    .timeline .step{display:flex;align-items:center;text-align:left;gap:14px;}
    .timeline .step .node{margin:0;flex:none;}
    .summary-grid{grid-template-columns:1fr;}
  }

  /* ---------- DASHBOARD KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:30px;}
  .kpi-card{
    background:#fff;border:1px solid var(--gray-border);border-radius:10px;
    padding:16px;text-align:center;
    box-shadow:0 2px 8px rgba(16,30,54,.04);
  }
  .kpi-card .val{font-size:28px;font-weight:bold;color:var(--navy);font-family:Verdana,sans-serif;}
  .kpi-card .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:bold;letter-spacing:.3px;margin-top:6px;}
  @media (max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:520px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}

  /* ---------- ADMIN TOOLBAR ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input[type=text]{
    flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--gray-border);border-radius:6px;font-size:13.5px;font-family:inherit;
  }
  .toolbar select{
    padding:10px 12px;border:1px solid var(--gray-border);border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff;
  }
  .btn{
    border:none;border-radius:6px;padding:10px 16px;font-weight:bold;font-size:13px;cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--accent);}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn-outline:hover{background:var(--accent-light);}
  .btn-sm{padding:6px 12px;font-size:12px;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,25,45,.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:#fff;border-radius:10px;max-width:480px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;
  }
  .modal-header{background:var(--navy);color:#fff;padding:16px 20px;font-weight:bold;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
  .modal-header .close{cursor:pointer;font-size:18px;opacity:.8;}
  .modal-header .close:hover{opacity:1;}
  .modal-body{padding:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:bold;color:var(--navy);margin-bottom:6px;}
  .field select, .field input, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--gray-border);border-radius:6px;
    font-family:Verdana,sans-serif;font-size:13px;background:var(--yellow);
  }
  .field textarea{min-height:70px;resize:vertical;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--gray-border);display:flex;justify-content:flex-end;gap:10px;}
  .lock-note{
    font-size:12px;color:var(--text-muted);background:var(--gray-bg);border-radius:6px;padding:10px 12px;margin-top:4px;
  }

  .disclaimer{
    font-size:11.5px;color:var(--text-muted);text-align:center;padding:18px 24px 0;
  }

  footer.site-footer{
    text-align:center;color:var(--text-muted);font-size:12px;padding:26px 20px 40px;
  }

#loginWrap{max-width:420px;margin:50px auto;} .msg{font-size:13px;margin-top:8px} .ok{color:#2e7d32} .err{color:#b00020}
@media(max-width:720px){.grid2{grid-template-columns:1fr}.search-card{flex-direction:column}.search-card button{height:44px}table.grid{min-width:1000px}}
</style>
<style>
/* Admin navigation / dashboard additions */
.admin-nav{display:flex;gap:4px;align-items:center}
.admin-nav a{cursor:pointer}
.view{display:none}
.view.active{display:block}
.toolbar .grow{flex:1;min-width:240px}
.kpi-grid{margin-top:8px}
.pending-note{font-size:12px;color:var(--text-muted);margin:-4px 0 12px}
.table-wrap{overflow:auto;border-radius:8px}
.clickable-row{cursor:pointer}
.clickable-row:hover{background:#F3F6FB!important}
.detail-panel{margin-top:18px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.detail-card{background:#fff;border:1px solid var(--gray-border);border-radius:8px;padding:14px 16px}
.detail-card .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:bold}
.detail-card .v{font-size:14px;margin-top:5px;font-family:Verdana,sans-serif;word-break:break-word}
.small-muted{font-size:12px;color:var(--text-muted)}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}.navbar{padding:0 12px}.navbar nav a{padding:8px 7px;font-size:12px}}
</style>
</head>
<body>
<div class="navbar">
  <div class="brand"><span class="dot"></span> FUND TRANSFER STATUS</div>
  <nav class="admin-nav">
    <a id="navHome">Home</a>
    <a id="navDashboard" class="active">Dashboard</a>
    <a id="navAll">All Transfers</a>
  </nav>
  <div class="role-toggle"><span class="who">Viewing as: Admin</span><button id="logoutBtn">LOG OUT</button></div>
</div>

<div class="page" id="loginWrap">
  <div class="section-title">ADMIN LOGIN</div>
  <div class="section-body">
    <div class="field"><label>Admin Key</label><input id="adminKey" type="password" placeholder="Enter admin key"></div>
    <button class="btn btn-primary" id="loginBtn">SIGN IN</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="adminApp" class="hidden">
  <div id="homeView" class="view active"></div>
  <div id="dashboardView" class="view"></div>
  <div id="allView" class="view"></div>
  <div id="detailView" class="view"></div>
</div>

<footer class="site-footer">Internal Fund Transfer Monitoring</footer>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz0sxKdrhalq6WXyFpAu4KVgVnXpQdasbRq-UKJQvqe8jID54pdzmFT1qyLH8u-UUwV/exec';
let adminKey='';
let allRows=[];
let lastQuery='';

const $=id=>document.getElementById(id);
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function has(v){return v!==null&&v!==undefined&&String(v).trim()!=='';}
function peso(v){
  if(!has(v)) return '—';
  const n=Number(String(v).replace(/,/g,''));
  return Number.isFinite(n)?'₱ '+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v);
}
function fmtDate(v){
  if(!has(v)) return '—';
  const s=String(v);
  const d=new Date(s.length<=10?s+'T00:00:00':s);
  return isNaN(d)?esc(v):d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
}
function statusKey(s){
  const x=String(s||'').trim().toUpperCase();
  if(!x) return '';
  if(x==='PENDING') return 'PENDING';
  if(x.includes('FORWARD')) return 'FORWARDED_TO_GEN_ACCTG';
  if(x==='PRINTED') return 'PRINTED';
  if(x==='COMPLETED') return 'COMPLETED';
  if(x==='CANCELLED') return 'CANCELLED';
  return x;
}
function pill(s){
  const x=String(s||'').toUpperCase()||'PENDING';
  const c=statusKey(x);
  return `<span class="pill st-${c}"><span class="dot"></span>${esc(x)}</span>`;
}
function displayField(v, money=false){
  if(!has(v)) return '—';
  return money?peso(v):esc(v);
}
function isRealRecord(r){
  // Ignore trailing/formula-only rows returned by the Google Sheet.
  // A blank or zero numeric formula value is not treated as a detail.
  const textFields=[
    'Control No.','Customer','Branch (check issued to)','Invoice No.',
    'Check No.','Bank','PR/CR No.','Prepared By','Updated By','Remarks'
  ];
  if(textFields.some(k=>has(r[k]))) return true;

  const dateFields=['Date','Check Date','Remittance Date','Printed Date','Forwarded Date'];
  if(dateFields.some(k=>has(r[k]))) return true;

  const numericFields=['Amount','Amount Issued','Branches Partial Amount'];
  return numericFields.some(k=>{
    if(!has(r[k])) return false;
    const n=Number(String(r[k]).replace(/,/g,'').replace(/₱/g,'').trim());
    return Number.isFinite(n) && n!==0;
  });
}
function validPending(r){
  return String(r['Status']||'').trim().toUpperCase()==='PENDING' && isRealRecord(r);
}
async function apiSearch(q=''){
  const res=await fetch(`${API_URL}?action=search&q=${encodeURIComponent(q)}`);
  return res.json();
}
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $(name).classList.add('active');
  $('navHome').classList.toggle('active',name==='dashboardView' && false);
  $('navDashboard').classList.toggle('active',name==='dashboardView');
  $('navAll').classList.toggle('active',name==='allView');
  window.scrollTo({top:0,behavior:'smooth'});
}
function tableRows(rows, includeDate=false){
  if(!rows.length) return `<div class="empty-state"><div class="big">✓</div>No records to display.</div>`;
  return `<div class="table-wrap"><table class="grid"><thead><tr>
    <th>Control No.</th>${includeDate?'<th>Payment / Remittance Date</th>':''}
    <th>Customer</th><th>Branch (check issued to)</th><th>Invoice No.</th>
    <th>Amount</th><th>Branches Partial Amount</th><th>Current Status</th>
  </tr></thead><tbody>
  ${rows.map((r,i)=>`<tr class="clickable-row" data-index="${i}">
    <td>${displayField(r['Control No.'])}</td>
    ${includeDate?`<td>${fmtDate(r['Remittance Date']||r['Date'])}</td>`:''}
    <td>${displayField(r['Customer'])}</td>
    <td>${displayField(r['Branch (check issued to)'])}</td>
    <td>${displayField(r['Invoice No.'])}</td>
    <td class="num">${peso(r['Amount'])}</td>
    <td class="num">${peso(r['Branches Partial Amount'])}</td>
    <td>${pill(r['Status'])}</td>
  </tr>`).join('')}
  </tbody></table></div>`;
}
function bindRowClicks(containerId, rows){
  document.querySelectorAll(`#${containerId} .clickable-row`).forEach((el,i)=>{
    el.onclick=()=>openDetail(rows[i]);
  });
}
function renderHome(){
  $('homeView').innerHTML=`
    <section class="hero">
      <h1>FUND TRANSFER STATUS</h1>
      <p>Check the status of your Fund Transfer</p>
      <form class="search-card" id="homeSearchForm">
        <input id="homeSearch" type="text" autocomplete="off"
          placeholder="Search by Fund Transfer No., Invoice No., Customer, or Check No.">
        <button type="submit">SEARCH</button>
      </form>
      <div class="search-hint">
        e.g. "FT-0353", an invoice number, customer name, or check number
      </div>
    </section>
    <div class="home-below">
      <div class="quicklinks">
        <div class="quicklink-card">
          <div class="k">Total Fund Transfers</div>
          <div class="v">${allRows.length} records loaded</div>
        </div>
        <div class="quicklink-card">
          <div class="k">Pending</div>
          <div class="v">${allRows.filter(validPending).length} pending records</div>
        </div>
        <div class="quicklink-card">
          <div class="k">Live Data</div>
          <div class="v">Connected to the deployed Apps Script</div>
        </div>
      </div>
    </div>`;
  $('homeSearchForm').onsubmit=async e=>{
    e.preventDefault();
    const q=$('homeSearch').value.trim();
    if(!q) return;
    try{
      const d=await apiSearch(q);
      const rows=d.ok?(d.results||[]).filter(isRealRecord):[];
      lastQuery=q;
      renderAll(rows);
      showView('allView');
    }catch(err){
      alert('Could not reach the deployed Apps Script.');
    }
  };
}
function renderDashboard(){
  const counts={PENDING:0,PRINTED:0,FORWARDED_TO_GEN_ACCTG:0,COMPLETED:0,CANCELLED:0};
  allRows.forEach(r=>{
    const raw=String(r['Status']||'').trim().toUpperCase();
    const k=statusKey(raw);
    if(counts[k]!==undefined) counts[k]++;
  });
  const pending=allRows.filter(validPending);
  $('dashboardView').innerHTML=`
    <div class="page">
      <h2 class="page-h">Admin Dashboard</h2>
      <p class="page-sub">Monitoring overview across the Fund Transfer records returned by the deployed Apps Script.</p>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="val">${allRows.length}</div><div class="lbl">Records Loaded</div></div>
        <div class="kpi-card"><div class="val">${counts.PENDING}</div><div class="lbl">Pending</div></div>
        <div class="kpi-card"><div class="val">${counts.PRINTED}</div><div class="lbl">Printed</div></div>
        <div class="kpi-card"><div class="val">${counts.FORWARDED_TO_GEN_ACCTG}</div><div class="lbl">Forwarded to Gen. Acctg</div></div>
        <div class="kpi-card"><div class="val">${counts.COMPLETED}</div><div class="lbl">Completed</div></div>
        <div class="kpi-card"><div class="val">${counts.CANCELLED}</div><div class="lbl">Cancelled</div></div>
      </div>
      <div class="card-block">
        <div class="section-title">PENDING — NEEDS ATTENTION</div>
        <div class="section-body">
          <div class="pending-note">${pending.length ? pending.length + ' pending record(s) with actual details displayed.' : 'No pending records with details found in the Google Sheet.'}</div>
          <div id="pendingTable">${tableRows(pending,true)}</div>
        </div>
      </div>
    </div>`;
  bindRowClicks('pendingTable',pending);
}
function renderAll(rows=allRows){
  $('allView').innerHTML=`
    <div class="page">
      <h2 class="page-h">All Fund Transfers</h2>
      <p class="page-sub">Search, filter, and view Fund Transfer records from the deployed Apps Script.</p>
      <div class="toolbar">
        <input class="grow" id="allSearch" type="text" placeholder="Search Fund Transfer No., Invoice No., Customer, Check No., Branch..." value="${esc(lastQuery)}">
        <select id="statusFilter">
          <option value="">All statuses</option><option value="PENDING">Pending</option>
          <option value="PRINTED">Printed</option><option value="FORWARDED">Forwarded</option>
          <option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option>
        </select>
        <button class="btn btn-primary" id="refreshBtn">REFRESH</button>
      </div>
      <div class="results-meta">${rows.length} result(s) displayed</div>
      <div id="allTable">${tableRows(rows,true)}</div>
    </div>`;
  $('allSearch').onkeydown=e=>{if(e.key==='Enter')doAllSearch();};
  $('statusFilter').onchange=applyFilter;
  $('refreshBtn').onclick=loadAll;
  bindRowClicks('allTable',rows);
}
function applyFilter(){
  const q=$('allSearch').value.trim().toLowerCase();
  const f=$('statusFilter').value;
  let rows=allRows.filter(r=>{
    const text=['Control No.','Customer','Branch (check issued to)','Invoice No.','Check No.','PR/CR No.']
      .map(k=>String(r[k]||'').toLowerCase()).join(' ');
    const invoice=String(r['Invoice No.']||'').toLowerCase();
    const matchesQ=!q||text.includes(q)||invoice.includes(q);
    const k=statusKey(r['Status']);
    const matchesF=!f||(f==='FORWARDED'?k==='FORWARDED_TO_GEN_ACCTG':k===f);
    return matchesQ&&matchesF;
  });
  $('allTable').innerHTML=tableRows(rows,true);
  $('.results-meta').textContent=rows.length+' result(s) displayed';
  bindRowClicks('allTable',rows);
}
async function doAllSearch(){
  lastQuery=$('allSearch').value.trim();
  try{
    const d=await apiSearch(lastQuery);
    if(d.ok){allRows=(d.results||[]).filter(isRealRecord);renderAll(allRows);renderDashboard();}
    else alert(d.error||'Search failed.');
  }catch(e){alert('Could not reach the deployed Apps Script.');}
}
async function loadAll(){
  const btn=$('refreshBtn'); if(btn){btn.disabled=true;btn.textContent='LOADING…';}
  try{
    const d=await apiSearch('');
    if(!d.ok) throw new Error(d.error||'Failed');
    allRows=(d.results||[]).filter(isRealRecord);lastQuery='';renderAll(allRows);renderDashboard();
  }catch(e){alert('Could not load the Fund Transfer data.');}
  finally{if(btn){btn.disabled=false;btn.textContent='REFRESH';}}
}
function openDetail(r){
  $('detailView').innerHTML=`
    <div class="page">
      <div class="back-link" id="backBtn">← Back</div>
      <div class="detail-top">
        <div><div class="ft-id">Fund Transfer</div><div class="ft-title">${displayField(r['Control No.'])}</div></div>
        <div>${pill(r['Status'])}</div>
      </div>
      <div class="detail-grid">
        <div class="detail-card"><div class="k">Customer</div><div class="v">${displayField(r['Customer'])}</div></div>
        <div class="detail-card"><div class="k">Branch (check issued to)</div><div class="v">${displayField(r['Branch (check issued to)'])}</div></div>
        <div class="detail-card"><div class="k">Invoice No.</div><div class="v">${displayField(r['Invoice No.'])}</div></div>
        <div class="detail-card"><div class="k">Amount</div><div class="v">${peso(r['Amount'])}</div></div>
        <div class="detail-card"><div class="k">Branches Partial Amount</div><div class="v">${peso(r['Branches Partial Amount'])}</div></div>
        <div class="detail-card"><div class="k">Payment / Remittance Date</div><div class="v">${fmtDate(r['Remittance Date']||r['Date'])}</div></div>
        <div class="detail-card"><div class="k">Printed Date</div><div class="v">${fmtDate(r['Printed Date'])}</div></div>
        <div class="detail-card"><div class="k">Forwarded Date</div><div class="v">${fmtDate(r['Forwarded Date'])}</div></div>
        <div class="detail-card"><div class="k">Last Updated</div><div class="v">${fmtDate(r['Last Updated'])}</div></div>
      </div>
    </div>`;
  $('backBtn').onclick=()=>showView('allView');
  showView('detailView');
}
$('loginBtn').onclick=async()=>{
  const key=$('adminKey').value.trim();
  $('loginMsg').textContent='Checking…';
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'checkKey',adminKey:key})});
    const d=await r.json();
    if(d.ok){
      adminKey=key;$('loginWrap').classList.add('hidden');$('adminApp').classList.remove('hidden');
      await loadAll();renderHome();showView('homeView');
    }else $('loginMsg').innerHTML='<span class="err">Incorrect key.</span>';
  }catch(e){$('loginMsg').innerHTML='<span class="err">Could not reach server.</span>';}
};
$('adminKey').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click();};
$('navHome').onclick=e=>{
  e.preventDefault();
  if(adminKey){
    renderHome();
    showView('homeView');
  }
};
$('navDashboard').onclick=e=>{
  e.preventDefault();
  if(adminKey){
    renderDashboard();
    showView('dashboardView');
  }
};
$('navAll').onclick=e=>{
  e.preventDefault();
  if(adminKey){
    renderAll(allRows);
    showView('allView');
  }
};
$('logoutBtn').onclick=()=>{adminKey='';allRows=[];$('adminApp').classList.add('hidden');$('loginWrap').classList.remove('hidden');$('adminKey').value='';$('loginMsg').textContent='';};
</script>
</body>
</html>
